services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: game_test_platform
      MYSQL_USER: game_test
      MYSQL_PASSWORD: game_test_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://game_test:game_test_password@mysql:3306/game_test_platform?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      API_ADMIN_KEY: local-admin-key
      API_VIEWER_KEY: local-viewer-key
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
